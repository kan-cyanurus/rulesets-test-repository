name: Deploy Changed Lambdas

on:
  push:
    branches:
      - develop
      - release
      - main
    paths:
      # Lambda関数のディレクトリパターン
      - 'test1-*/**'
      - 'test2-*/**'

env:
  REF_NAME: ${{ github.ref_name }}

permissions:
  id-token: write # OIDC（OpenID Connect）による認証情報の発行を許可
  contents: read # リポジトリの内容を読み取る権限を付与

# 同じブランチ内で同時実行制御の設定
concurrency:
  group: lambda-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.ref_name == 'develop' || github.ref_name == 'release' || github.ref_name == 'main' }}
    outputs:
      changed: ${{ steps.set-matrix.outputs.changed }}
      oidc_role: ${{ steps.set_oidc_role.outputs.oidc_role }}
    steps:
      - uses: actions/checkout@v4

      # 1. 外部YAMLから「キー: フィルタ」の形式だけを抽出して一時ファイルを作る
      - name: Generate filter file
        run: |
          # yq を使って filter 部分だけを抽出
          yq 'map_values(.filter)' .github/lambda-deploy-def-map.yml > .github/lambda-filters.yml

      # 2. 差分検知を実行   
      - id: filter
        # 差分のあるlambdaファイルを検出
        uses: dorny/paths-filter@v3
        with:
          filters: .github/lambda-filters.yml

      # 3. 差分があったキーに対して、元のYAMLから「キー, dir, filter」を取り出してJSON化
      - id: set-matrix
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          
          # 元のYAMLと変更リスト(CHANGES)を照合して、マトリックス用JSONを生成
          # キー、ディレクトリ、フィルタの3点を含むオブジェクトの配列を作る
          MATRIX=$(yq e -j '.github/lambda-deploy-def-map.yml' | jq -c --argjson changes "$CHANGES" '
            to_entries 
            | map(select(.key as $k | $changes | index($k))) 
            | map({
                key: .key,
                dir: .value.dir,
                filter: .value.filter
              })
          ')
          echo "changed=$MATRIX" >> $GITHUB_OUTPUT

      # OIDC_ROLEの設定
      - name: Set OIDC_ROLE
        id: set_oidc_role
        run: |
          if [ "$REF_NAME" = "develop" ]; then
            echo "oidc_role=${{ vars.OIDC_ROLE_DEV }}" >> $GITHUB_OUTPUT
          elif [ "$REF_NAME" = "release" ]; then
            echo "oidc_role=${{ vars.OIDC_ROLE_STG }}" >> $GITHUB_OUTPUT
          elif [ "$REF_NAME" = "main" ]; then
            echo "oidc_role=${{ vars.OIDC_ROLE_PRD }}" >> $GITHUB_OUTPUT
          else
            echo "oidc_role=" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: detect-changes
    if:  ${{ needs.detect-changes.outputs.changed != '[]' && needs.detect-changes.outputs.changed != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.changed) }}
    env:
      LAMBDA_NAME: ${{ matrix.lambda.key }}
      LAMBDA_DIR: ${{ matrix.lambda.dir }}
      OIDC_ROLE: ${{ needs.detect-changes.outputs.oidc_role }}
    steps:
      - uses: actions/checkout@v4

      # LAMBDAのZIP化
      # - name: Zip Lambda source
      # run: |
      #    cd $LAMBDA_NAME
      #    zip -r "../${LAMBDA_NAME}.zip" .
       #   cd ..
    
      # Lambdaのデプロイ処理
      - name: Deploy Lambda (${{ matrix.lambda }})
        run: |
          echo "LAMDA DEPLOY"
          echo "${{ env.LAMBDA_NAME }}"
          echo "${{ env.LAMBDA_DIR }}"
          echo "${{ env.OIDC_ROLE }}"
