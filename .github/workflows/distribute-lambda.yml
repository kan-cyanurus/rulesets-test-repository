name: Deploy Changed Lambdas

on:
  push:
    branches:
      - develop
      - release
      - main
    paths:
      # Lambda関数のディレクトリパターン
      - 'test1-*/**'
      - 'test2-*/**'

env:
  BRANCH_BASE: ${{ github.base_ref }}

permissions:
  id-token: write # OIDC（OpenID Connect）による認証情報の発行を許可
  contents: read # リポジトリの内容を読み取る権限を付与

# 同じブランチ内で同時実行制御の設定
concurrency:
  group: lambda-deploy-${{ github.base_ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.ref_name == 'develop' || github.ref_name == 'release' || github.ref_name == 'main' }}
    outputs:
      changed: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        # 差分のあるlambdaファイルを検出
        uses: dorny/paths-filter@v3
        with:
          filters: .github/lambda-deploy-def-map.yml

      # OIDC_ROLEの設定
      - name: Set OIDC_ROLE
        run: |
          if [ "$BRANCH_BASE" = "develop" ]; then
            echo "OIDC_ROLE= 開発" >> $GITHUB_ENV
          elif [ "$BRANCH_BASE" = "release" ]; then
            echo "OIDC_ROLE= 検証" >> $GITHUB_ENV
          elif [ "$BRANCH_BASE" = "master" ]; then
            echo "OIDC_ROLE= 本番" >> $GITHUB_ENV
          else
            echo "OIDC_ROLE=" >> $GITHUB_ENV
          fi

  deploy:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changed != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.changed) }}
    env:
      LAMBDA_NAME: ${{ matrix.lambda }}
    steps:
      - uses: actions/checkout@v4

      # Lambdaのデプロイ処理
      - name: Deploy Lambda (${{ matrix.lambda }})
        run: |
          echo "LAMDA DEPLOY"
